# Standards scored on the same recorded escape steps. The metric is
# detection-evidence coverage: for each eval-sandbox escape step, does the
# standard, as written, produce evidence a third party could receive WITHOUT
# access to the provider's network? observable_classes lists the crossing
# classes for which the standard yields such evidence.
#
# This measures detection evidence, not prevention. CSA AIS-13, Anthropic's
# practices and Mitchell's requirements are preventive: if followed they stop a
# step, but when a step occurs anyway (a zero-day, a bypass) they leave no
# third-party signal. That is the axis this benchmark measures; prevention is a
# separate axis the paper states.

standards:
  crosswire:
    label: "CrossWire (this work)"
    kind: detective
    custody: verifier
    observable_classes:
      - egress_dns
      - egress_http
      - egress_rawsocket
      - credential
      - shared_service_write
      - artifact_store
      - host_metadata
      - control_plane
      - public_web_write

  attestation:
    label: "Egress attestation (signed policy + flow-log digest)"
    kind: detective
    custody: provider
    observable_classes:
      - egress_dns
      - egress_http
      - egress_rawsocket
    note: >
      A flow-log digest shows outbound connections, so it can evidence internet
      egress. It does not show writes to an INTERNAL shared service (the
      Artifactory board), nor credential or control-plane use. A write to a
      public site through a read-only (GET) proxy -- the DseWiki case -- appears
      in flow logs as ordinary GETs, so public_web_write is not reliably
      evidenced. The digest is also provider-produced (a trust gap the paper
      notes); coverage here counts what it could show if produced honestly.

  csa_ais13:
    label: "CSA AI Controls Matrix AIS-13 + vuln-ops guidance"
    kind: preventive
    custody: provider
    observable_classes: []
    note: "Requires no egress and no live production credentials. Preventive config verified internally; no third-party detection evidence when bypassed."

  anthropic_aug31:
    label: "Anthropic Aug 2026 partner practices"
    kind: preventive
    custody: provider
    observable_classes: []
    note: "No-internet sandbox, API-only egress, keys outside, pre-engagement probe, real-time scope monitoring. Preventive and inward; the monitoring signal is provider-held."

  mitchell_r1_r5:
    label: "Mitchell R1-R5 architectural requirements"
    kind: preventive
    custody: provider
    observable_classes: []
    note: "Trust separation, intent inference, integrity monitoring, audit isolation, capability envelope. Architectural requirements; no third-party detection evidence."
